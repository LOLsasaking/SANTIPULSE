<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automation Ops Platform</title>
  <style>
    :root{color-scheme:dark;--blue:#0b3d91;--line:#1d3358;--panel:#0c1525;--muted:#8fa8cf}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#030712;color:#fff}.wrap{max-width:1180px;margin:auto;padding:32px}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:52px;line-height:.95;margin:0}p{color:var(--muted)}
    .grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px}
    textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;background:#07111f;color:#fff;padding:12px;font:inherit}button{border:0;border-radius:999px;background:var(--blue);color:white;padding:12px 16px;font-weight:800;margin-top:10px;cursor:pointer}
    .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{border:1px solid var(--line);border-radius:12px;padding:14px;background:#07111f;min-height:120px}.step span{color:#b9d8ff;font-size:12px;text-transform:uppercase;font-weight:900}.step strong{display:block;margin-top:12px}
    .runs{display:grid;gap:8px;margin-top:18px}.run{padding:10px;border:1px solid var(--line);border-radius:10px;background:#07111f;color:#b9d8ff}
    @media(max-width:900px){.grid,.flow{grid-template-columns:1fr}header{display:block}}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div><p>Operations software demo</p><h1>Automation Ops Platform</h1></div><p id="status">Backend ready</p></header>
    <div class="grid">
      <section class="card"><h2>Incoming event</h2><textarea id="payload">Urgent website request from a new client. Budget ready. Wants call today.</textarea><button id="run">Run workflow</button></section>
      <section class="card"><h2>Workflow</h2><div class="flow" id="flow"></div><div class="runs" id="runs"></div></section>
    </div>
  </div>
  <script>
    const flow=document.getElementById('flow'), runs=document.getElementById('runs');
    document.getElementById('run').onclick=async()=>{
      const payload=document.getElementById('payload').value;
      const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload})});
      const data=await res.json();
      flow.innerHTML=data.run.steps.map((s,i)=>`<div class="step"><span>Step ${i+1}</span><strong>${s[0]}</strong><p>${s[1]}</p></div>`).join('');
      runs.innerHTML=data.runs.map(r=>`<div class="run">${r.status} · ${r.priority} · ${new Date(r.at).toLocaleTimeString()}</div>`).join('');
    };
    document.getElementById('run').click();
  </script>
</body>
</html>
