<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Identity AI Studio</title>
  <style>
    :root{color-scheme:dark;--blue:#0b3d91;--line:#1d3358;--panel:#0c1525;--muted:#8fa8cf}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#030712;color:#fff}.wrap{max-width:1180px;margin:auto;padding:32px}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:52px;line-height:.95;margin:0}p{color:var(--muted)}
    .grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px}
    label{display:grid;gap:7px;margin-bottom:12px;color:#b9d8ff;font-size:12px;font-weight:900}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#07111f;color:#fff;padding:12px;font:inherit}button{border:0;border-radius:999px;background:var(--blue);color:white;padding:12px 16px;font-weight:800;cursor:pointer}
    .preview{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:center}.logo{aspect-ratio:1;border:1px solid var(--line);border-radius:24px;background:#07111f;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}
    .palette{display:flex;gap:10px;margin-top:16px}.palette span{width:46px;height:46px;border-radius:50%;border:1px solid var(--line)}
    .concepts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.concept{border:1px solid var(--line);border-radius:12px;background:#07111f;padding:8px}.concept img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#fff}.concept span{display:block;margin-top:7px;color:#b9d8ff;font-size:12px;font-weight:800}
    @media(max-width:900px){.grid,.preview{grid-template-columns:1fr}header{display:block}}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div><p>AI image generation backend</p><h1>Brand Identity AI Studio</h1></div><p id="mode">Ready</p></header>
    <div class="grid">
      <section class="card">
        <label>Brand name<input id="name" value="Santi Pulse"></label>
        <label>Sector<input id="sector" value="websites, AI and electrical work"></label>
        <label>Main color<input id="color" type="color" value="#0b3d91"></label>
        <label>Existing logo upload<input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label>
        <label>Direction<textarea id="direction">Premium, technical, reliable, clean logo for a real business software brand.</textarea></label>
        <button id="generate">Generate identity</button>
      </section>
      <section class="card preview">
        <div class="logo"><img id="logo" alt="Generated logo"></div>
        <div><h2 id="brand">Brand output</h2><p id="details">Generate a logo and brand kit.</p><div class="palette" id="palette"></div><div class="concepts" id="concepts"></div></div>
      </section>
    </div>
  </div>
  <script>
    let logoDataUrl='';
    upload.onchange=()=>{
      const file=upload.files&&upload.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{logoDataUrl=String(reader.result||'');};
      reader.readAsDataURL(file);
    };
    async function generate(){
      const body={name:name.value,sector:sector.value,color:color.value,direction:direction.value,logoDataUrl};
      mode.textContent='Generating...';
      const res=await fetch('/api/generate-brand',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await res.json();
      logo.src=data.image; brand.textContent=data.kit.name; details.textContent=`Mode: ${data.mode} · ${data.kit.sector}`;
      palette.innerHTML=data.kit.palette.map(c=>`<span style="background:${c}"></span>`).join('');
      concepts.innerHTML=(data.concepts||[]).map(c=>`<div class="concept"><img src="${c.image}" alt=""><span>${c.name}</span></div>`).join('');
      mode.textContent=data.mode;
    }
    generate.onclick=generate; generate();
  </script>
</body>
</html>
