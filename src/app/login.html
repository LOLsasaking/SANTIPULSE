<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Acceder · Santipulse</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23050505'/%3E%3Cg fill='%23FFFFFF'%3E%3Cpolygon points='50,12 28,48 72,48'/%3E%3Cpolygon points='88,50 52,28 52,72'/%3E%3Cpolygon points='50,88 72,52 28,52'/%3E%3Cpolygon points='12,50 48,72 48,28'/%3E%3C/g%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',sans-serif; background:#050505; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .headline{ font-family:'Archivo',sans-serif; font-weight:900; text-transform:uppercase; line-height:.9; letter-spacing:-.02em; }
  .mono{ font-family:'Space Mono',monospace; }
  .eyebrow{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:rgba(255,255,255,.55); }
  .card{ width:100%; max-width:420px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.09); border-radius:20px; padding:38px 32px; }
  label{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.5); display:block; margin-bottom:7px; }
  input{ width:100%; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:11px; padding:13px 14px; color:#fff; font-size:15px; transition:border-color .25s; }
  input:focus{ outline:none; border-color:rgba(226,59,78,.6); }
  input::placeholder{ color:rgba(255,255,255,.3); }
  button{ width:100%; font-family:'Space Mono',monospace; font-weight:700; font-size:13px; letter-spacing:.16em; text-transform:uppercase; background:#fff; color:#050505; padding:14px; border-radius:9999px; border:0; cursor:pointer; margin-top:18px; transition:opacity .25s; }
  button:disabled{ opacity:.5; cursor:wait; }
  .msg{ font-size:14px; margin-top:18px; padding:13px 15px; border-radius:11px; line-height:1.5; }
  .msg.ok{ background:rgba(64,200,120,.12); border:1px solid rgba(64,200,120,.35); color:#9ff0bd; }
  .msg.err{ background:rgba(226,59,78,.1); border:1px solid rgba(226,59,78,.3); color:#ff9aa6; }
  .hidden{ display:none; }
  a.back{ color:rgba(255,255,255,.55); text-decoration:none; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.16em; text-transform:uppercase; }
  a.back:hover{ color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow" style="margin:0 0 14px">Santipulse · Panel</p>
    <h1 class="headline" style="font-size:34px; margin:0 0 8px">Acceder</h1>
    <p style="color:rgba(255,255,255,.6); font-size:14px; margin:0 0 26px">Introduce tu email y te enviamos un enlace de acceso. Sin contraseñas.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="tu@email.com" required />
      <button id="submitBtn" type="submit">Enviar enlace</button>
    </form>

    <div id="ok" class="msg ok hidden">Revisa tu correo — te enviamos un enlace de acceso. Ábrelo en este dispositivo.</div>
    <div id="err" class="msg err hidden"></div>

    <p style="margin:26px 0 0"><a class="back" href="/">← Volver a santipulse.com</a></p>
  </div>

  {{sb.config}}
  <script src="/supabase.js"></script>
  <script src="/auth.js"></script>
  <script src="/login.js" defer></script>
</body>
</html>
