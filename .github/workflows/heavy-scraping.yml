name: Pulse external automation jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  collect-trends:
    name: Collect social trends (Insights de Redes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect trends → /api/insights/ingest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.PULSE_CRON_SECRET }}
          IG_GRAPH_TOKEN: ${{ secrets.IG_GRAPH_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: node scripts/collect-trends.mjs

  trigger-worker:
    name: Nudge the cron worker (drains due posts/jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/cron/process
        env:
          PULSE_CRON_URL: ${{ secrets.PULSE_CRON_URL }}
          PULSE_CRON_SECRET: ${{ secrets.PULSE_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PULSE_CRON_URL:-}" ]; then
            echo "PULSE_CRON_URL is not configured; skipping external trigger."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${PULSE_CRON_SECRET:-}" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-actions","job":"pulse-heavy-tasks"}' \
            "$PULSE_CRON_URL"
